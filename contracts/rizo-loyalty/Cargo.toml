[package]
name = "rizo-loyalty"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "25" }
# Pin ethnum (transitive dependency of soroban-env-common) to a release that
# compiles on modern toolchains. ethnum <= 1.5.2 fails with E0512
# (`mem::transmute(())` -> `TryFromIntError`) on Rust >= 1.97 because
# TryFromIntError changed size. See https://github.com/nlordell/ethnum-rs/issues/58
ethnum = "1.5.3"

[dev-dependencies]
soroban-sdk = { version = "25", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
